<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macrodata Refinement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1F2E;
    --fg: #8ceffe;
    --bleed: rgba(140, 239, 254, 0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    font-family: 'VT323', monospace;
    color: var(--fg);
    font-size: 2vw;
    text-shadow: 0 0 5px color-mix(in srgb, currentColor 60%, transparent);
  }
  #field {
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: url("data:image/svg+xml,%3Csvg%20width='26'%20height='36'%20viewBox='0%200%20104%20146'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3E%3Cpath%20d='M5%205L100%20100L42.5%20102.5L5%20141V5Z'%20fill='%230F1F2E'%20stroke='%238ceffe'%20stroke-width='10'%20stroke-linejoin='bevel'/%3E%3C/svg%3E") 2 2, auto;
  }
  .cell {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scale {
    color: var(--fg);
    transform-origin: center center;
    will-change: transform;
    transition: transform 0.75s cubic-bezier(0.249, 0.582, 0.209, 0.993),
                opacity 0.75s cubic-bezier(0.249, 0.582, 0.209, 0.993),
                color 0.75s cubic-bezier(0.249, 0.582, 0.209, 0.993);
  }
  .scale.sel {
    color: #ffffff;
  }
  .float {
    display: block;
    line-height: 1;
    user-select: none;
    will-change: transform;
    opacity: 0;                 /* hidden until the staggered reveal fades it in */
  }
  /* staggered fade-in reveal of the number field when a session begins */
  @keyframes mdrReveal { from { opacity: 0; } to { opacity: 1; } }
  #field.reveal .float {
    animation: mdrReveal 0.4s ease-in both;      /* forwards fill holds opacity 1 */
    animation-delay: var(--reveal-delay, 0s);    /* random 0–0.6s per cell */
  }
  #hud {
    position: fixed;
    top: -1.25vw;
    left: -1.25vw;
    right: -1.25vw;
    z-index: 300;
    display: flex;
    align-items: center;
    gap: 2.5vw;
    padding: 4vw 8vw 1.5vw;
    background: var(--bg);
    border-bottom: 3px double var(--fg);   /* two 1px lines, 1px gap */
  }
  .name-box {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1vw;
    border: 1px solid var(--fg);
    padding: 0.5vw 1.375vw;
  }
  .puzzle {
    font-size: 2.5vw;
    letter-spacing: 0.04em;
    color: var(--fg);
    user-select: none;
  }
  .complete {
    font-size: 1.875vw;
    letter-spacing: 0.06em;
    color: var(--fg);
    user-select: none;
  }
  .lumon {
    height: 3.75vw;
    width: auto;
    display: block;
  }

  #bins {
    position: fixed;
    left: -1.25vw;
    right: -1.25vw;
    bottom: -1.25vw;
    z-index: 300;
    display: flex;
    justify-content: center;
    gap: 1.8vw;                            /* +60% spacing between bins */
    padding: 1.5vw 8vw 4vw;
    background: var(--bg);
    border-top: 3px double var(--fg);      /* two 1px lines, 1px gap */
  }
  .bin {
    flex: 1 1 0;
    max-width: 22.5vw;
    display: flex;
    flex-direction: column;
    gap: 0.5vw;
  }
  .bin-id {
    height: 2.875vw;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--fg);
  }
  .bin-id span {
    font-size: 2vw;
    letter-spacing: 0.08em;
    color: var(--fg);
    user-select: none;
  }
  .bin-bar {
    position: relative;
    height: 2.5vw;
    border: 1px solid var(--fg);
    overflow: hidden;
  }
  .bin-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    background: var(--fg);
  }
  .bin-pct {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2vw;
    letter-spacing: 0.04em;
    color: var(--fg);
    user-select: none;
  }
  .ghost-num {
    position: fixed;
    z-index: 400;
    pointer-events: none;
    color: #ffffff;
    line-height: 1;
    font-size: 2vw;
    transform-origin: center center;
  }
  .ghost-num.drop {
    transition: transform 0.45s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.45s ease-in;
  }
  @keyframes binGlitch {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-4px) skewX(-6deg); }
    40%  { transform: translateX(4px); }
    60%  { transform: translateX(-3px) skewX(5deg); }
    80%  { transform: translateX(3px); }
    100% { transform: translateX(0); }
  }
  @keyframes binFlicker {
    0%, 100% { opacity: 1; }
    25% { opacity: 0.25; }
    50% { opacity: 0.85; }
    75% { opacity: 0.1; }
  }
  .bin.glitch .bin-bar { animation: binGlitch 0.15s steps(2) 3; }
  .bin.glitch .bin-fill { animation: binFlicker 0.12s steps(1) 4; }
  #hud, #bins { box-shadow: 0 0 12px var(--bleed), inset 0 0 12px var(--bleed); }
  .name-box, .bin-id, .bin-bar { box-shadow: 0 0 7px var(--bleed), inset 0 0 7px var(--bleed); }
  .bin-fill { box-shadow: 0 0 8px rgba(140, 239, 254, 0.55); }
  .lumon { filter: drop-shadow(0 0 5px rgba(140, 239, 254, 0.6)); }

  /* ---- player entry / identity screen ---- */
  #entry {
    /* the field text size; button label and tagline derive from it */
    --field-fs: 2.75vw;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--bg);
    display: flex;
    align-items: center;      /* form centered on screen; */
    justify-content: center;  /* logo + tagline are pinned separately */
    padding: 1.5vw;
    transition: opacity 0.6s ease;
  }
  #entry.hide { opacity: 0; pointer-events: none; }
  .entry-logo {
    position: absolute;
    top: 7vh;
    left: 50%;
    transform: translateX(-50%);
    width: 13.125vw;
    filter: drop-shadow(0 0 8px rgba(140, 239, 254, 0.6));
  }
  .entry-logo svg { display: block; width: 100%; height: auto; }
  .entry-form {
    display: flex;
    align-items: stretch;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1.375vw;
    width: 47.5vw;
  }
  #name-input {
    flex: 1 1 21.25vw;
    min-width: 13.75vw;
    background: transparent;
    border: 1.5px solid var(--fg);
    color: var(--fg);
    caret-color: var(--fg);
    font-family: 'VT323', monospace;
    font-size: var(--field-fs);
    letter-spacing: 0.03em;
    padding: 0.625vw 1.375vw;
    outline: none;
    box-shadow: 0 0 7px var(--bleed), inset 0 0 7px var(--bleed);
    text-shadow: 0 0 5px color-mix(in srgb, currentColor 60%, transparent);
  }
  #name-input::placeholder {
    color: color-mix(in srgb, var(--fg) 55%, transparent);
  }
  #name-input:focus {
    box-shadow: 0 0 12px var(--bleed), inset 0 0 12px var(--bleed);
  }
  #get-severed {
    flex: 0 0 auto;
    background: var(--fg);
    color: var(--bg);                       /* navy label */
    border: 1.5px solid var(--fg);
    font-family: 'VT323', monospace;        /* match the field */
    font-size: calc(var(--field-fs) * 0.7); /* 70% of field text */
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0 2.5vw;
    cursor: inherit;
    box-shadow: 0 0 10px rgba(140, 239, 254, 0.55);
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  #get-severed:hover { filter: brightness(1.12); }
  #get-severed:active { transform: translateY(1px); }
  .entry-tagline {
    position: absolute;
    bottom: 7vh;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    font-size: calc(var(--field-fs) * 0.7); /* same as the button label */
    letter-spacing: 0.08em;
    text-align: center;
    color: var(--fg);
    user-select: none;
  }
  @keyframes entryShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  #entry.shake .entry-form { animation: entryShake 0.32s ease; }

  /* ---- end-game (Waffle Party) screen ---- */
  #endscreen {
    position: fixed;
    inset: 0;
    z-index: 1100;
    display: none;
    background: var(--bg);
    color: var(--fg);
    padding: 4vw;
  }
  #endscreen.show { display: block; }
  .end-logo {
    position: absolute;
    top: 4vw;
    left: 4vw;
    width: 11.375vw;
    filter: drop-shadow(0 0 8px rgba(140, 239, 254, 0.6));
  }
  .end-logo svg { display: block; width: 100%; height: auto; }
  .end-video {
    position: absolute;
    top: 50%;
    right: 3.5vw;
    transform: translateY(-50%);   /* vertically centered on screen */
    width: 40vw;
    height: auto;
    /* soft-fade all four edges (~10%) so the video melts into the background */
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
    mask-composite: intersect;
  }
  .end-content {
    position: absolute;
    left: 4vw;
    top: 24vh;
    width: 52%;
  }
  .end-heading {
    font-size: 2.25vw;
    line-height: 1.25;
    letter-spacing: 0.01em;
    margin-bottom: 5vh;
  }
  .end-subhead {
    font-size: 2.25vw;
    letter-spacing: 0.02em;
    margin-bottom: 1vw;
  }
  .end-board { list-style: none; }
  .end-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1vw;
    padding: 1vh 0.25vw;
    border-top: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
    font-size: 2.25vw;
  }
  .end-row:last-child { border-bottom: 1px solid color-mix(in srgb, var(--fg) 35%, transparent); }
  .end-praise {
    position: absolute;
    right: 4vw;
    bottom: 3.375vw;
    margin: 1vw 2vw;
    font-size: 1.8vw;
    line-height: 1.5;
    text-align: left;
    letter-spacing: 0.02em;
  }
  .end-praise a {
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="entry">
    <div class="entry-logo" id="entry-logo"></div>
    <form class="entry-form" id="entry-form" autocomplete="off">
      <input id="name-input" type="text" placeholder="Player Name" maxlength="24"
             spellcheck="false" autocomplete="off" aria-label="Player name">
      <button id="get-severed" type="submit">Get Severed</button>
    </form>
    <div class="entry-tagline">The work is mysterious and important.</div>
  </div>
  <header id="hud">
    <div class="name-box">
      <span class="puzzle">Cold Harbor</span>
      <span class="complete">0% Complete</span>
    </div>

  <script>
    const COLS = 14, ROWS = 8;          // visible matrix
    const BUF = 1;                       // buffer ring for seamless scroll
    const POOL_C = COLS + BUF * 2;
    const POOL_R = ROWS + BUF * 2;
    const MAX_SCALE = 6;
    let RADIUS = 258, logDenom = Math.log(1 + RADIUS);   // proximity radius, viewport-relative (set in sizeCells)

    const field = document.getElementById('field');
    let cellW = 0, cellH = 0;
    let offX = 0, offY = 0;              // rendered pan offset (eased)
    let targetX = 0, targetY = 0;        // pan target driven by wheel
    let lastT = 0;
    const EASE_TAU = 0.25;               // ~0.75s trailing settle, matches hover feel
    let mx = -9999, my = -9999;
    let panning = false, selecting = false;
    let panVX = 0, panVY = 0, lastPanT = 0;   // middle-drag velocity for release momentum
    let dragging = false, downX = 0, downY = 0, downKey = null;
    const selected = new Set();           // world-coord keys "wc,wr"
    const draggingKeys = new Set();       // selected keys currently lifted (rendered empty)
    const bump = new Map();               // world key -> refresh count (changes the digit)
    const ghostLayer = document.getElementById('ghost-layer');
    let ghosts = [];

    // bins / progress
    const bins = [...document.querySelectorAll('.bin')].map((el, i) => {
      el.dataset.idx = i;
      return { el, pct: 0, fill: el.querySelector('.bin-fill'), pctEl: el.querySelector('.bin-pct') };
    });
    function applyBin(i) {
      const b = bins[i];
      b.fill.style.width = b.pct + '%';
      b.pctEl.textContent = b.pct + '%';
      b.pctEl.style.color = b.pct >= 50 ? 'var(--bg)' : 'var(--fg)';  // readable once the fill covers it
    }
    function updateGlobal() {
      const avg = Math.round(bins.reduce((s, b) => s + b.pct, 0) / bins.length);
      document.querySelector('.complete').textContent = avg + '% Complete';
    }
    function selectionSum() {
      let s = 0;
      for (const k of selected) {
        const [c, r] = k.split(',').map(Number);
        s += digitAt(c, r);
      }
      return s;
    }
    function tween(from, to, dur, cb, done) {
      const start = performance.now();
      (function step(now) {
        const t = Math.min((now - start) / dur, 1);
        const e = 1 - Math.pow(1 - t, 3);
        cb(from + (to - from) * e);
        if (t < 1) requestAnimationFrame(step);
        else if (done) done();
      })(performance.now());
    }
    function animateBin(i, from, to, dur, done) {
      const b = bins[i];
      tween(from, to, dur || 600, v => {
        b.fill.style.width = v + '%';
        b.pctEl.textContent = Math.round(v) + '%';
        b.pctEl.style.color = v >= 50 ? 'var(--bg)' : 'var(--fg)';  // navy over the cyan fill
      }, done);
    }
    function animateGlobal() {
      const el = document.querySelector('.complete');
      const from = parseInt(el.textContent, 10) || 0;
      const to = Math.round(bins.reduce((s, b) => s + b.pct, 0) / bins.length);
      tween(from, to, 600, v => { el.textContent = Math.round(v) + '% Complete'; });
    }
    function depositToBin(i) {
      if (!selected.size) return;
      const b = bins[i];
      if (b.pct >= 100 || b.busy) return;            // exactly full, or mid-animation: unavailable
      const from = b.pct;
      const total = from + selectionSum();
      for (const k of selected) bump.set(k, (bump.get(k) || 0) + 1);  // refresh with new numbers
      selected.clear();
      draggingKeys.clear();
      if (total > 100) {                             // went over: fill, glitch, restart at the overage
        const over = total - 100;
        b.busy = true;
        animateBin(i, from, 100, 250, () => {
          b.el.classList.add('glitch');
          setTimeout(() => {
            b.el.classList.remove('glitch');
            b.pct = over;
            animateBin(i, 0, over, 500, () => { b.busy = false; });
            animateGlobal();
            persistScores();
          }, 450);
        });
      } else {
        b.pct = total;                               // under 100, or exactly 100 (locks)
        animateBin(i, from, b.pct);
        animateGlobal();
        persistScores();
        checkComplete();                             // all bins full → Waffle Party
      }
    }

    function makeGhosts() {
      clearGhosts();
      for (const k of draggingKeys) {
        const [c, r] = k.split(',').map(Number);
        const g = document.createElement('div');
        g.className = 'ghost-num';
        g.textContent = digitAt(c, r);
        g.dataset.cx = c * cellW - offX + cellW / 2;
        g.dataset.cy = r * cellH - offY + cellH / 2;
        g.style.left = g.dataset.cx + 'px';
        g.style.top = g.dataset.cy + 'px';
        g.style.transform = 'translate(-50%, -50%) scale(3.5)';
        ghostLayer.appendChild(g);
        ghosts.push(g);
      }
    }
    function moveGhosts(dx, dy) {
      for (const g of ghosts) {
        g.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(3.5)`;
      }
    }
    function clearGhosts() { for (const g of ghosts) g.remove(); ghosts = []; }
    function flightToBin(i) {
      const rect = bins[i].el.getBoundingClientRect();
      const bx = rect.left + rect.width / 2;
      const by = rect.top + rect.height / 2;
      for (const g of ghosts) {
        const tx = bx - parseFloat(g.dataset.cx);
        const ty = by - parseFloat(g.dataset.cy);
        g.classList.add('drop');
        g.style.opacity = '0';
        g.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.2)`;
      }
      setTimeout(() => { clearGhosts(); depositToBin(i); }, 460);
    }
    function abortDrag() { clearGhosts(); draggingKeys.clear(); }
    function transferWithFlight(i) {
      if (!selected.size || bins[i].pct >= 100 || bins[i].busy) return;
      draggingKeys.clear();
      for (const s of selected) draggingKeys.add(s);
      makeGhosts();
      flightToBin(i);
    }
    bins.forEach((b, i) => applyBin(i));
    bins.forEach((b, i) => b.el.addEventListener('click', () => transferWithFlight(i)));
    updateGlobal();

    // deterministic pseudo-random per world coordinate
    function hash2(c, r, salt) {
      let h = (Math.imul(c, 374761393) + Math.imul(r, 668265263) + Math.imul(salt, 2246822519)) | 0;
      h = Math.imul(h ^ (h >>> 15), 2246822519);
      h = Math.imul(h ^ (h >>> 13), 3266489917);
      h = (h ^ (h >>> 16)) >>> 0;
      return h / 4294967295;
    }
    const digitAt = (c, r) => Math.floor(hash2(c, r, bump.get(c + ',' + r) || 0) * 10);

    // build the recycled cell pool
    const pool = [];
    for (let n = 0; n < POOL_C * POOL_R; n++) {
      const root = document.createElement('div');
      root.className = 'cell';
      const scaleEl = document.createElement('div');
      scaleEl.className = 'scale';
      const floatEl = document.createElement('span');
      floatEl.className = 'float';
      floatEl.style.setProperty('--reveal-delay', (Math.random() * 0.6).toFixed(3) + 's');  // random stagger
      scaleEl.appendChild(floatEl);
      root.appendChild(scaleEl);
      field.appendChild(root);
      pool.push({ root, scaleEl, floatEl, lastDigit: -1, lastSel: false });
    }

    function sizeCells() {
      cellW = window.innerWidth / COLS;
      cellH = window.innerHeight / ROWS;
      RADIUS = Math.min(window.innerWidth, window.innerHeight) * 0.258;  // scales with viewport
      logDenom = Math.log(1 + RADIUS);
      for (const c of pool) {
        c.root.style.width = cellW + 'px';
        c.root.style.height = cellH + 'px';
      }
    }
    window.addEventListener('resize', sizeCells);
    sizeCells();

    function keyUnder() {
      if (mx < 0) return null;
      const wc = Math.floor((mx + offX) / cellW);
      const wr = Math.floor((my + offY) / cellH);
      return wc + ',' + wr;
    }
    function selectAtCursor() {
      const k = keyUnder();
      if (!k || selected.has(k) || selected.size >= 8) return;
      selected.add(k);
    }

    field.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      if (panning) {
        targetX -= e.movementX;                 // grab: canvas follows the hand
        targetY -= e.movementY;
        const now = performance.now();
        const dt = Math.max(now - lastPanT, 1);
        panVX = -e.movementX / dt * 1000;       // px/s for release momentum
        panVY = -e.movementY / dt * 1000;
        lastPanT = now;
      }
      if (selecting) selectAtCursor();
    });
    field.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });
    field.addEventListener('mousedown', e => {
      if (e.button === 1) { e.preventDefault(); panning = true; selected.clear(); panVX = 0; panVY = 0; lastPanT = performance.now(); }   // middle: grab to pan
      else if (e.button === 0) {
        mx = e.clientX; my = e.clientY;
        downX = e.clientX; downY = e.clientY;
        const k = keyUnder();
        if (k && selected.has(k)) {            // lift the selection and follow the cursor
          dragging = true;
          downKey = k;
          draggingKeys.clear();
          for (const s of selected) draggingKeys.add(s);
          makeGhosts();
        } else {
          if (k) selected.clear();             // every new click starts fresh
          selecting = true;
          selectAtCursor();
        }
      }
    });
    window.addEventListener('mousemove', e => {
      if (dragging) moveGhosts(e.clientX - downX, e.clientY - downY);
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 1) {
        panning = false;
        if (performance.now() - lastPanT > 80) { panVX = 0; panVY = 0; }  // held still before release: no glide
      }
      if (e.button === 0) {
        selecting = false;
        if (dragging) {
          dragging = false;
          const el = document.elementFromPoint(e.clientX, e.clientY);
          const binEl = el && el.closest('.bin');
          const moved = Math.hypot(e.clientX - downX, e.clientY - downY) > 6;
          const di = binEl ? Number(binEl.dataset.idx) : -1;
          if (di >= 0 && bins[di].pct < 100 && !bins[di].busy) {
            flightToBin(di);                                // deposits after numbers fall in
          } else if (!moved && downKey) {
            abortDrag();
            selected.clear(); selected.add(downKey);        // click on a selected number: reselect just it
          } else {
            abortDrag();                                    // dropped off-target: numbers return
          }
          downKey = null;
        }
      }
    });
    window.addEventListener('keydown', e => {
      if (selected.size && e.key >= '1' && e.key <= '5' && bins[Number(e.key) - 1].pct < 100) {
        depositToBin(Number(e.key) - 1);
      }
    });
    field.addEventListener('wheel', e => {
      e.preventDefault();
      if (selected.size) selected.clear();
      targetX += e.deltaX;
      targetY += e.deltaY;
    }, { passive: false });


    function tick(t) {
      const time = t * 0.001;
      const dt = lastT ? Math.min((t - lastT) / 1000, 0.1) : 0;
      lastT = t;
      const a = 1 - Math.exp(-dt / EASE_TAU);
      if (!panning && (Math.abs(panVX) > 5 || Math.abs(panVY) > 5)) {
        targetX += panVX * dt;                  // release momentum
        targetY += panVY * dt;
        const friction = Math.exp(-dt / 0.6);   // glide dies out over ~1s
        panVX *= friction; panVY *= friction;
      }
      offX += (targetX - offX) * a;
      offY += (targetY - offY) * a;

      const startCol = Math.floor(offX / cellW) - BUF;
      const startRow = Math.floor(offY / cellH) - BUF;

      let idx = 0;
      for (let j = 0; j < POOL_R; j++) {
        for (let i = 0; i < POOL_C; i++) {
          const cell = pool[idx++];
          const wc = startCol + i;
          const wr = startRow + j;

          const boxX = wc * cellW - offX;
          const boxY = wr * cellH - offY;
          cell.root.style.transform = `translate(${boxX}px, ${boxY}px)`;

          const isDrag = draggingKeys.has(wc + ',' + wr);
          const d = isDrag ? '' : digitAt(wc, wr);
          if (d !== cell.lastDigit) { cell.floatEl.textContent = d; cell.lastDigit = d; }

          const sel = !isDrag && selected.has(wc + ',' + wr);
          if (sel !== cell.lastSel) { cell.scaleEl.classList.toggle('sel', sel); cell.lastSel = sel; }

          if (isDrag) {
            // empty gap where the numbers were lifted from
            cell.floatEl.style.transform = 'translate(0px, 0px)';
            cell.scaleEl.style.transform = 'scale(1)';
            cell.scaleEl.style.opacity = 1;
            cell.root.style.zIndex = '';
          } else if (sel) {
            // locked: white, no drift, held at 3.5x
            cell.floatEl.style.transform = 'translate(0px, 0px)';
            cell.scaleEl.style.transform = 'scale(3.5)';
            cell.scaleEl.style.opacity = 1;
            cell.root.style.zIndex = 100;
          } else {
            // stable drift per world coordinate (halved amplitude)
            const ax = 1 + hash2(wc, wr, 1) * 2;
            const ay = 1 + hash2(wc, wr, 2) * 2;
            const fx = 0.4 + hash2(wc, wr, 3) * 0.6;
            const fy = 0.4 + hash2(wc, wr, 4) * 0.6;
            const px = hash2(wc, wr, 5) * 6.283;
            const py = hash2(wc, wr, 6) * 6.283;
            const ox = Math.sin(time * fx + px) * ax;
            const oy = Math.cos(time * fy + py) * ay;
            cell.floatEl.style.transform = `translate(${ox}px, ${oy}px)`;

            // proximity scale, logarithmic falloff
            const cx = boxX + cellW / 2;
            const cy = boxY + cellH / 2;
            const dist = Math.hypot(cx - mx, cy - my);
            let scale = 1, op = 1;
            if (dist < RADIUS) {
              const falloff = 1 - Math.log(1 + dist) / logDenom;
              scale = 1 + (MAX_SCALE - 1) * falloff;
              op = 1 - (0.01 + 0.49 * falloff);
            }
            cell.scaleEl.style.transform = `scale(${scale})`;
            cell.scaleEl.style.opacity = op;
            cell.root.style.zIndex = scale > 1.01 ? Math.round(scale * 10) : '';
          }
        }
      }
      requestAnimationFrame(tick);
    }

    document.fonts.ready.then(() => { sizeCells(); requestAnimationFrame(tick); });
    requestAnimationFrame(tick);

    // ---- player entry / identity ----
    // The name entered here replaces the file name in the header and is the key
    // under which this refiner's progress is stored, ready to be centralized later.
    const NAME_KEY = 'mdr.playerName';
    const SCORE_KEY = 'mdr.scores';

    // ---- shared leaderboard (Supabase REST) ----
    // The publishable key is meant to live in the client; access is gated by
    // the table's row-level policies, not by keeping this secret.
    const SB_URL = 'https://mtyomfuczqvwrdpnjinw.supabase.co';
    const SB_KEY = 'sb_publishable_jGGUzSViYszzfXHAuPE-BQ_3i2AhoLw';
    const SB_REST = SB_URL + '/rest/v1/scores';
    const SB_HEADERS = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

    // send this refiner's completion time to the shared board
    async function submitScore(name, timeSec) {
      if (!name) return;
      try {
        const res = await fetch(SB_REST, {
          method: 'POST',
          headers: { ...SB_HEADERS, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({ name: name.slice(0, 24), time_sec: Number(timeSec.toFixed(2)) }),
        });
        if (!res.ok) console.warn('[mdr] score submit failed', res.status, await res.text());
      } catch (e) { console.warn('[mdr] score submit error', e); }
    }

    // pull the global top 10 (best time per refiner, fastest first)
    async function fetchBoard() {
      try {
        const res = await fetch(SB_REST + '?select=name,time_sec&order=time_sec.asc&limit=200', { headers: SB_HEADERS });
        if (!res.ok) { console.warn('[mdr] board fetch failed', res.status, await res.text()); return null; }
        const data = await res.json();
        const best = new Map();               // rows arrive fastest-first, so first seen per name is their best
        for (const r of data) {
          if (!best.has(r.name)) best.set(r.name, { name: r.name, time: Number(r.time_sec) });
        }
        return [...best.values()].slice(0, 10);
      } catch (e) { console.warn('[mdr] board fetch error', e); return null; }
    }
    const entry = document.getElementById('entry');
    const entryForm = document.getElementById('entry-form');
    const nameInput = document.getElementById('name-input');
    const puzzleEl = document.querySelector('.puzzle');
    let playerName = '';

    // reuse the header's Lumon globe for the boot screen
    const logoSrc = document.querySelector('.lumon');
    if (logoSrc) {
      const clone = logoSrc.cloneNode(true);
      clone.removeAttribute('class');
      document.getElementById('entry-logo').appendChild(clone);
    }

    // convenience: pre-fill with the last refiner's name
    const lastName = localStorage.getItem(NAME_KEY);
    if (lastName) nameInput.value = lastName;

    function persistScores() {
      if (!playerName) return;
      let store = {};
      try { store = JSON.parse(localStorage.getItem(SCORE_KEY) || '{}'); } catch (e) { store = {}; }
      store[playerName] = {
        ...(store[playerName] || {}),   // keep any previously recorded best time
        name: playerName,
        bins: bins.map(b => Math.round(b.pct)),
        complete: Math.round(bins.reduce((s, b) => s + b.pct, 0) / bins.length),
        updated: Date.now(),
      };
      try { localStorage.setItem(SCORE_KEY, JSON.stringify(store)); } catch (e) {}
    }
    // exposed so a future score-syncing layer can read the current record
    window.mdrGetScores = () => { try { return JSON.parse(localStorage.getItem(SCORE_KEY) || '{}'); } catch (e) { return {}; } };

    function beginSession(name) {
      playerName = name;
      sessionStart = performance.now();      // start the clock for this refiner's time
      localStorage.setItem(NAME_KEY, name);
      puzzleEl.textContent = name;           // the refiner's name stands in for "Cold Harbor"
      persistScores();                       // seed the record at 0%
      entry.classList.add('hide');
      setTimeout(() => { entry.style.display = 'none'; field.classList.add('reveal'); }, 650);
    }

    entryForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = nameInput.value.trim().replace(/\s+/g, ' ');
      if (!name) {                           // no empty names — nudge the field
        entry.classList.remove('shake');
        void entry.offsetWidth;              // restart the animation
        entry.classList.add('shake');
        nameInput.focus();
        return;
      }
      beginSession(name);
    });

    nameInput.focus();

    // ---- end-game (Waffle Party) screen ----
    let sessionStart = performance.now();
    const endScreen = document.getElementById('endscreen');
    const endName = document.getElementById('end-name');
    const endBoard = document.getElementById('end-board');

    // reuse the Lumon globe up top
    if (logoSrc) {
      const endLogo = logoSrc.cloneNode(true);
      endLogo.removeAttribute('class');
      document.getElementById('end-logo').appendChild(endLogo);
    }

    // record this refiner's completion time (keep their best) for the shared board
    function recordTime(name, timeSec) {
      if (!name) return;
      let store = {};
      try { store = JSON.parse(localStorage.getItem(SCORE_KEY) || '{}'); } catch (e) { store = {}; }
      const rec = store[name] || { name, bins: [0, 0, 0, 0, 0], complete: 0, updated: Date.now() };
      if (typeof rec.time !== 'number' || timeSec < rec.time) rec.time = timeSec;
      rec.name = name;
      rec.updated = Date.now();
      store[name] = rec;
      try { localStorage.setItem(SCORE_KEY, JSON.stringify(store)); } catch (e) {}
    }

    // paint a list of {name, time} rows into the board, fastest first
    function paintBoard(list) {
      endBoard.textContent = '';
      for (const r of list) {
        const li = document.createElement('li');
        li.className = 'end-row';
        const n = document.createElement('span');
        n.textContent = r.name;                 // textContent keeps user names inert
        const t = document.createElement('span');
        t.textContent = r.time.toFixed(1) + 's';
        li.append(n, t);
        endBoard.appendChild(li);
      }
    }

    // fallback board from this device's stored scores (shown until the shared board loads)
    function localBoard() {
      const store = window.mdrGetScores();
      const rows = Object.values(store)
        .filter(r => typeof r.time === 'number')
        .sort((a, b) => a.time - b.time)   // fastest first
        .slice(0, 10);                     // top 10 only
      return rows.length
        ? rows.map(r => ({ name: r.name, time: r.time }))
        : (playerName ? [{ name: playerName, time: (performance.now() - sessionStart) / 1000 }] : []);
    }

    async function showEndScreen() {
      const timeSec = (performance.now() - sessionStart) / 1000;
      recordTime(playerName, timeSec);          // keep a local record too
      endName.textContent = playerName || 'Refiner';
      paintBoard(localBoard());                 // show something instantly
      endScreen.classList.add('show');
      const v = endScreen.querySelector('video');
      if (v) { try { v.currentTime = 0; v.play(); } catch (e) {} }
      // then sync with the shared leaderboard
      await submitScore(playerName, timeSec);
      const shared = await fetchBoard();
      if (shared && shared.length) paintBoard(shared);
    }
    function hideEndScreen() { endScreen.classList.remove('show'); }

    // all five bins full → celebrate (delay lets the last bar finish filling)
    function checkComplete() {
      if (bins.every(b => b.pct >= 100)) setTimeout(() => showEndScreen(), 900);
    }

    // Escape closes the end screen
    window.addEventListener('keydown', e => { if (e.key === 'Escape') hideEndScreen(); });
  </script>
</body>
</html>
